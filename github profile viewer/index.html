<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="viewer-panel" aria-label="GitHub profile search">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.03c-3.2.7-3.87-1.38-3.87-1.38-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .98-.31 3.18 1.18A11.1 11.1 0 0 1 12 6.14c.98 0 1.96.13 2.88.39 2.2-1.49 3.17-1.18 3.17-1.18.64 1.58.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.07.78 2.16v3.04c0 .3.21.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
          </svg>
        </div>
        <div>
          <p class="eyebrow">GitHub Finder</p>
          <h1>Profile Viewer</h1>
        </div>
      </div>

      <form class="search-box" id="searchForm">
        <label class="sr-only" for="username">GitHub username</label>
        <input id="username" type="search" placeholder="Search username, e.g. torvalds" autocomplete="off" required>
        <button type="submit">
          <span>Search</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.75 4a6.75 6.75 0 0 1 5.38 10.83l3.52 3.52a.92.92 0 0 1-1.3 1.3l-3.52-3.52A6.75 6.75 0 1 1 10.75 4Zm0 1.85a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8Z"/>
          </svg>
        </button>
      </form>

      <div class="status" id="status" role="status">Type a GitHub username to explore the public profile.</div>

      <article class="profile-card hidden" id="profileCard">
        <div class="profile-top">
          <img id="avatar" class="avatar" src="" alt="">
          <div class="identity">
            <p class="username" id="handle"></p>
            <h2 id="name"></h2>
            <p id="bio" class="bio"></p>
          </div>
        </div>

        <div class="stats-grid">
          <div>
            <strong id="repos">0</strong>
            <span>Repos</span>
          </div>
          <div>
            <strong id="followers">0</strong>
            <span>Followers</span>
          </div>
          <div>
            <strong id="following">0</strong>
            <span>Following</span>
          </div>
        </div>

        <div class="meta-grid">
          <p id="location"></p>
          <p id="company"></p>
          <p id="blog"></p>
          <p id="joined"></p>
        </div>

        <div class="actions">
          <a id="visitProfile" class="primary-link" href="#" target="_blank" rel="noreferrer">
            Visit Profile
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 5.25c0-.41.34-.75.75-.75h4.5c.41 0 .75.34.75.75v4.5a.75.75 0 0 1-1.5 0V7.06l-6.22 6.22a.75.75 0 1 1-1.06-1.06l6.22-6.22h-2.69a.75.75 0 0 1-.75-.75ZM5.5 7A1.5 1.5 0 0 1 7 5.5h4a.75.75 0 0 0 0-1.5H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-4a.75.75 0 0 0-1.5 0v4A1.5 1.5 0 0 1 17 18.5H7A1.5 1.5 0 0 1 5.5 17V7Z"/>
            </svg>
          </a>
        </div>
      </article>
    </section>

    <section class="repo-panel" aria-label="Latest repositories">
      <div class="section-head">
        <p class="eyebrow">Latest Work</p>
        <h2>Public Repositories</h2>
      </div>
      <div id="repoList" class="repo-list empty-state">
        Search any username to see recent repositories here.
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
