<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJJWAL To do with speech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">
                UJJWAL To do with speech
                <span class="logo-dot"></span>
            </div>
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 01-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search tasks (Press '/' to focus)...">
            </div>
            <div class="header-actions">
                <button onclick="toggleVoiceRecognition()" id="voice-button" class="voice-btn" title="Voice Command">
                    <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="mic-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m-.5-15a3.5 3.5 0 10-7 0v4a3.5 3.5 0 007 0V6z" />
                    </svg>
                </button>
                <button onclick="showAddModal()" class="add-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>NEW TASK</span>
                </button>
            </div>
        </header>
        <div class="main-content">
            <div class="board" id="board">
                <div class="column todo-header" id="todo-column" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'todo')">
                    <div class="column-header">
                        <div class="column-title">To Do</div>
                        <div class="column-count" id="todo-count">0</div>
                    </div>
                    <div class="task-list" id="todo-list"></div>
                </div>
                <div class="column progress-header" id="progress-column" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'inprogress')">
                    <div class="column-header">
                        <div class="column-title">In Progress</div>
                        <div class="column-count" id="progress-count">0</div>
                    </div>
                    <div class="task-list" id="progress-list"></div>
                </div>
                <div class="column done-header" id="done-column" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'done')">
                    <div class="column-header">
                        <div class="column-title">Done</div>
                        <div class="column-count" id="done-count">0</div>
                    </div>
                    <div class="task-list" id="done-list"></div>
                </div>
            </div>
            <div class="analytics-panel">
                <div class="analytics-header">Progress</div>
                <canvas id="progress-canvas" width="160" height="160"></canvas>
                <div class="completion-text" id="completion-percent">0</div>
                <div class="completion-label">COMPLETED</div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-number" id="total-tasks">0</span>
                        <span class="stat-label">TOTAL</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" style="color: #eab308;" id="todo-stat">0</span>
                        <span class="stat-label">TODO</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" style="color: #3b82f6;" id="progress-stat">0</span>
                        <span class="stat-label">ACTIVE</span>
                    </div>
                </div>
                <div onclick="clearCompleted()" class="clear-done-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 7l-.595 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.595-1.858L5 7" />
                    </svg>
                    <span>CLEAR DONE</span>
                </div>
            </div>
        </div>
        <div class="hint">
            <span style="color:#22c55e">🎤</span>
            <span>Say "add task [your task]" • Double-click card to edit</span>
        </div>
    </div>
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Create new task</div>
                <div onclick="hideAddModal()" class="close-modal-btn">×</div>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Task title</label>
                    <input type="text" id="modal-task-title" class="form-input" placeholder="Use 'HIGH:' or 'LOW:' for tags...">
                </div>
                <div class="form-group">
                    <label class="form-label">Initial status</label>
                    <select id="modal-task-status" class="form-input">
                        <option value="todo">To Do</option>
                        <option value="inprogress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="hideAddModal()" class="modal-btn modal-btn-cancel">Cancel</button>
                <button onclick="addTaskFromModal()" class="modal-btn modal-btn-add">Add to board</button>
            </div>
        </div>
    </div>
    <div class="voice-modal" id="voice-modal">
        <div class="voice-modal-content">
            <div class="voice-wave-container">
                <div class="voice-ripple"></div>
                <div class="voice-mic-large">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m-.5-15a3.5 3.5 0 10-7 0v4a3.5 3.5 0 007 0V6z" />
                    </svg>
                </div>
            </div>
            <div class="voice-status-text" id="voice-status-text">Listening...</div>
            <div class="voice-close-btn" onclick="toggleVoiceRecognition()">Cancel</div>
        </div>
    </div>
    <div id="toast" class="toast">
        <span id="toast-icon">✅</span>
        <span id="toast-message">Task added successfully</span>
    </div>
    <script src="./index.js"></script>
</body>
</html>
